test-paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }


[bundles]

adventure = [
    "adventure-api",
    "adventure-nbt",
    "adventure-key",
    "adventure-text-minimessage",
    "adventure-text-serializer-commons",
    "adventure-text-serializer-legacy",
    "adventure-text-serializer-gson",
    "adventure-text-serializer-json-legacy-impl",
    "adventure-text-serializer-json",
]

sparrow = [
    "sparrow-nbt",
    "sparrow-nbt-adventure",
    "sparrow-nbt-codec",
    "sparrow-nbt-legacy-codec",
    "sparrow-yaml"
]