# Do not modify this value
config-version: "${config_version}"

#
# For safety reasons, editing this file requires a restart to apply
#

test:
  enable: true
  permission: ce.command.admin.test
  usages:
    - /sparrow-sync test


reload:
  enable: true
  permission: ce.command.admin.reload
  usages:
    - /sparrow-sync reload

debug_save_binary:
  enable: true
  permission: ce.command.debug.save_binary
  usages:
    - /sparrow-sync debug save-binary

debug_save_json:
  enable: true
  permission: ce.command.debug.save_json
  usages:
    - /sparrow-sync debug save-json

debug_apply:
  enable: true
  permission: ce.command.debug.apply
  usages:
    - /sparrow-sync debug apply
