# Do not modify this value
config-version: "${config_version}"

#
# For safety reasons, editing this file requires a restart to apply
#

reload:
  enable: true
  permission: ce.command.admin.reload
  usages:
    - /sparrow-sync reload

test:
  enable: true
  permission: ce.command.admin.test
  usages:
    - /sparrow-sync test